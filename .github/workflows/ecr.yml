name: Build and Push to ACR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 1. Log in to your specific ACR
      - name: Login to ACR
        run: az acr login --name SongSouggest

      # 2. Build the image and tag it for SongSouggest
      # This step "bakes" the model weights and dependencies into the image.
      - name: Build and Push Image
        run: |
          docker build -t songsouggest.azurecr.io/backend:${{ github.sha }} .
          docker push songsouggest.azurecr.io/backend:${{ github.sha }}

      # 3. Update the Web App to use the new image
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'song-suggest-fastapi'
          images: 'songsouggest.azurecr.io/backend:${{ github.sha }}'
