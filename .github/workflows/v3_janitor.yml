name: Run V3 Janitor Backfill

on:
  schedule:
    # Run every night at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual triggering from the GitHub Actions tab

jobs:
  run-janitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install DB Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic sqlalchemy psycopg2-binary pgvector python-dotenv
          
      - name: Install ML Dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch sentence-transformers
          
      - name: Run Janitor Script
        env:
          POSTGRES_DATABASE_URL: ${{ secrets.POSTGRES_DATABASE_URL }}
        run: |
          python v3_janitor.py
