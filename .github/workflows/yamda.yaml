name: YAMDA Dataset Backfill

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: 'Number of YAMDA tracks to ingest'
        required: true
        default: '100000'

jobs:
  backfill_yamda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install heavy ML deps first so poetry doesn't re-download them
          pip install datasets psycopg2-binary sentence-transformers torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-root
          
      - name: Run Janitor Backfill Script
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_DATABASE_URL }}
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size }}
        run: |
          export PYTHONPATH=$(pwd)
          python scripts/janitor_yamda_backfill.py
