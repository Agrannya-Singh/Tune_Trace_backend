[tool.poetry]
name = "tune-trace-backend"
version = "0.1.0"
description = "Semantic RAG engine for song recommendations using Gemini and pgvector"
authors = ["Agrannya Singh"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = ">=0.27,<0.47"}
gunicorn = ">=21.2,<26.0"
sentence-transformers = ">=2.3.1,<6.0.0"
google-generativeai = "^0.3.2"
redis = ">=5.0.1,<8.0.0"
sqlalchemy = "^2.0.25"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
